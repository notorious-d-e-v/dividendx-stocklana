[package]
name = "dividendx"
version = "0.1.0"
description = "DividendX annual Solana collateral and claim program"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "dividendx"

[features]
default = []
anchor-debug = []
custom-heap = []
custom-panic = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "=1.2.0", features = ["init-if-needed"] }
anchor-spl = { version = "=1.2.0", default-features = false, features = ["associated_token", "token", "token_2022", "token_2022_extensions"] }
num-bigint = { version = "=0.5.1", default-features = false }
bytemuck = "=1.25.2"
solana-sha256-hasher = { version = "=3.1.0", features = ["sha2"] }

[dev-dependencies]
anchor-lang-idl = { version = "=0.1.4", features = ["build"] }
proptest = "=1.9.0"
serde_json = "=1.0.149"
