[package]
name = "dividendx-protocol-tests"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "dividendx_protocol_tests"
path = "src/lib.rs"

[dependencies]
agave-feature-set = "=4.1.1"
agave-precompiles = "=4.1.1"
bincode = "=1.3.3"
borsh = { version = "=1.6.0", features = ["derive"] }
bs58 = "=0.5.1"
hex = "=0.4.3"
mollusk-svm = { version = "=0.14.0", features = ["inner-instructions"] }
mollusk-svm-programs-token = "=0.14.0"
mollusk-svm-programs-token-2022 = "=0.14.0"
num-bigint = "=0.4.6"
num-integer = "=0.1.46"
num-traits = "=0.2.19"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
solana-account = "=4.3.1"
solana-address = "=2.6.1"
solana-bpf-loader-program = "=4.1.1"
solana-clock = "=3.1.1"
solana-compute-budget = "=4.1.1"
solana-epoch-rewards = "=3.1.0"
solana-epoch-schedule = "=3.2.0"
solana-fee-calculator = "=3.2.2"
solana-hash = "=4.4.0"
solana-instruction = "=3.4.0"
solana-instruction-error = "=2.3.0"
solana-instructions-sysvar = "=3.0.0"
solana-last-restart-slot = "=3.1.0"
solana-loader-v3-interface = "=7.0.0"
solana-message = "=4.2.3"
solana-nonce = "=3.2.0"
solana-packet = "=4.1.0"
solana-program-runtime = "=4.1.1"
solana-program-option = "=3.1.0"
solana-program-pack = "=3.1.0"
solana-pubkey = "=4.2.0"
solana-rent = "=4.3.0"
solana-reward-info = "=6.2.0"
solana-sdk-ids = "=3.1.0"
solana-secp256k1-recover = "=3.1.1"
solana-short-vec = "=3.2.2"
solana-signature = "=3.4.1"
solana-slot-hashes = "=3.1.0"
solana-stake-history = "=1.0.0"
solana-svm-callback = "=4.1.1"
solana-svm-feature-set = "=4.1.1"
solana-svm-log-collector = "=4.1.1"
solana-svm-timings = "=4.1.1"
solana-svm-transaction = "=4.1.1"
solana-syscalls = "=4.1.1"
solana-system-interface = { version = "=3.2.0", features = ["wincode"] }
solana-system-program = "=4.1.1"
solana-sysvar = "=4.1.0"
solana-transaction = "=4.1.2"
solana-transaction-context = "=4.1.1"
solana-transaction-error = "=3.3.0"
solana-transaction-status-client-types = "=4.1.1"
spl-associated-token-account-interface = "=2.0.0"
spl-token-2022-interface = "=3.0.1"
spl-token-interface = "=2.0.0"
wincode = "=0.5.4"
